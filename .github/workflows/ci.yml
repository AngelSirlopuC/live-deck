name: CI

on:
  push:
  pull_request:

# Read-only token: CI never pushes, publishes or comments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/deck-migration.test.ts reads decks from an older commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, never push: images are built by whoever self-hosts.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: live-deck:ci
